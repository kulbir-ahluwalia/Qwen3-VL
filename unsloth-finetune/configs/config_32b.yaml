# Qwen3-VL 32B Fine-tuning Configuration
# =========================================
# Requires 4x H100 80GB GPUs with DeepSpeed ZeRO-3
# Uses 4-bit quantization + LoRA + gradient offloading

# Model
model_size: "32B"
max_seq_length: 2048

# Training (reduced for memory)
batch_size: 1
gradient_accumulation: 8
learning_rate: 2e-4
num_epochs: 3
warmup_steps: 100

# LoRA Configuration
lora_r: 64
lora_alpha: 128
lora_dropout: 0.05
finetune_vision: true
finetune_language: true

# Output
output_dir: "./checkpoints/32b"
export_gguf: true
gguf_quantization: "q4_k_m"

# Logging
wandb_project: "qwen3vl-waypoints"
logging_steps: 10

# Misc
seed: 42
